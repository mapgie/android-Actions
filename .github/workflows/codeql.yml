name: CodeQL

on:
  workflow_call:
    inputs:
      codeql-config-path:
        description: Path to the CodeQL config file (relative to the repo root).
        required: false
        type: string
        default: ./.github/codeql/codeql-config.yml
      gradle-version:
        description: Gradle version to install.
        required: false
        type: string
        default: '8.13'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          config-file: ${{ inputs.codeql-config-path }}

      - uses: mapgie/android-Actions/.github/actions/setup-gradle-env@03a8dfd32ef0e703cc1506c1105bdb98f31a29cc # v1
        with:
          checkout: 'false'
          gradle-version: ${{ inputs.gradle-version }}
          cache-read-only: 'false'

      # --no-build-cache: in a repo with org.gradle.caching=true, a PR that only
      # touches workflow files restores every compile task from the cache, so the
      # compiler never runs and CodeQL fails with "could not process any code".
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
