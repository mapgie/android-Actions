name: CodeQL

on:
  workflow_call:
    inputs:
      codeql-config-path:
        description: Path to the CodeQL config file (relative to the repo root).
        required: false
        type: string
        default: ./.github/codeql/codeql-config.yml
      gradle-version:
        description: Gradle version to install.
        required: false
        type: string
        default: '8.13'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: java-kotlin
          config-file: ${{ inputs.codeql-config-path }}

      - uses: mapgie/android-Actions/.github/actions/setup-gradle-env@1a6f42d3abb98e085e01ec0803a74e0902b55ff3 # v1
        with:
          checkout: 'false'
          gradle-version: ${{ inputs.gradle-version }}
          cache-read-only: 'false'

      # --no-build-cache: in a repo with org.gradle.caching=true, a PR that only
      # touches workflow files restores every compile task from the cache, so the
      # compiler never runs and CodeQL fails with "could not process any code".
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:java-kotlin
