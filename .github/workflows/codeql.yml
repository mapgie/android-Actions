name: CodeQL

on:
  workflow_call:
    inputs:
      codeql-config-path:
        description: Path to the CodeQL config file (relative to the repo root).
        required: false
        type: string
        default: ./.github/codeql/codeql-config.yml
      gradle-version:
        description: Gradle version to install.
        required: false
        type: string
        default: '8.13'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: java-kotlin
          config-file: ${{ inputs.codeql-config-path }}

      - uses: mapgie/android-Actions/.github/actions/setup-gradle-env@252cf0054ab486b6aa3e87563bc12146d97ff891 # v1
        with:
          checkout: 'false'
          gradle-version: ${{ inputs.gradle-version }}
          cache-read-only: 'false'

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:java-kotlin
